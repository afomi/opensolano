url: "https://opensolano.org" # the base hostname & protocol for your site; GitHub Pages custom domain is the apex (www 301s here)
baseurl: "" # the subpath of your site, e.g. /blog
title: "OpenSolano - Civic Data & Government Transparency for Solano County" # the name of your site, e.g. ACME Corp.
description: "Open-source governance analysis covering Fairfield, Vallejo, Vacaville, Suisun City, Benicia, Dixon, and Rio Vista. Municipal budgets, impact fees, and civic transparency for all Solano County jurisdictions."

collections_dir: collections

collections:
  jurisdictions:
    output: true
    permalink: /jurisdictions/:id
  agencies:
    output: true
    permalink: /agencies/:slug
  bodies:
    output: true
    permalink: /bodies/:slug
  positions:
    output: true
    permalink: /positions/:slug
  people:
    output: true
    permalink: /people/:id
  services:
    output: true
    permalink: /services/:id
  projects:
    output: true
    permalink: /projects/:path/

plugins:
  - jekyll-datapage-generator

page_gen:
  - data: vacaville_parks.parks
    template: park
    name: slug
    title: park_name
    dir: cities/vacaville/parks
    index_files: true
  - data: vacaville_parcels.parcels
    template: parcel
    name: slug
    title: address
    dir: parcels
    index_files: true

exclude:
  - package.json
  - package-lock.json
  - tmp/