# Budget flow data for "Where the Money Flows" Sankey diagrams.
#
# Schema (designed to generalize: Vacaville -> Solano County -> each Solano
# city -> any U.S. jurisdiction via jurisdictional.org):
#
#   jurisdictions:          list; one entry per jurisdiction + fund + fiscal year
#     slug                  stable key used by the include param
#     name / fund / fiscal_year / population
#     hub_label             center node label (e.g. "General Fund")
#     total_official        the jurisdiction's own published total for the fund
#     source:               provenance block (required — every figure traceable)
#     groups:               ordered list; display + color-slot order.
#                           side: revenue | spending. Color slots are assigned
#                           by list order (validated 8-slot categorical palette),
#                           so keep total colored groups <= 8; groups with
#                           neutral: true render gray (flow-through, not a series).
#     flows:                detail line items; each belongs to a group.
#                           amount in exact dollars as published.
#                           derived: true marks a balancing figure computed from
#                           published schedules rather than printed directly —
#                           always pair with a note.
#
# All Vacaville FY2025-26 figures are the "FY 2025/26 Proposed Budget" column
# of the Final Budget Document summary schedules, cross-checked against the
# printed subtotals (they reconcile to the dollar; see notes).

